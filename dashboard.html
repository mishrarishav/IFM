<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Check Report Dashboard</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f4f6f9;
        }
        .ribbon {
            position: relative;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .ribbon::before, .ribbon::after {
            content: '';
            position: absolute;
            top: 100%;
            border: 20px solid transparent;
            border-top-color: #007bff;
        }
        .ribbon::before {
            left: 0;
            border-right-width: 0;
        }
        .ribbon::after {
            right: 0;
            border-left-width: 0;
        }
        .card-custom {
            margin-bottom: 20px;
            /* padding: 20px; */
            border-radius: 10px;
            height: 300px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .card-custom h5 {
            background-color: #007bff;
            color: white;
            /* padding: 10px; */
            border-radius: 5px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 200px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }
        .total-scans-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .total-scans-box {
            display: inline-block;
            padding: 10px;
            border: 2px solid #007bff;
            border-radius: 5px;
            background-color: #f8f9fa;
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }
        .pie-chart {
            width: 50%;
            height: 102%;
            border-radius: 50%;
            background: conic-gradient(#28a745 0% 50%, #dc3545 50% 100%);
            position: relative;
        }
        .pie-chart .legend {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .bar-chart {
            display: flex;
            height: 100%;
            align-items: flex-end;
        }
        .bar {
            flex: 1;
            margin: 0 8px; /* Increased gap between bars */
            background-color: #227019;
            position: relative;
        }
        .bar-label {
            background-color:#77ff00;
            position: absolute;
            border-radius: 50%;
            /* top: -30px; */
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .x-axis, .y-axis {
            display: flex;
            justify-content: space-between;
        }
        .y-axis {
            flex-direction: column;
            justify-content: space-between;
            display: none; /* Hide y-axis */
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="ribbon">Quality Check Dashboard</div>

        <!-- Grid for Cards -->
        <div class="dashboard-grid">
            <!-- Card 1: Total Scans -->
            <div class="card card-custom">
                <div class="card-body">
                    <h5>Total Scans Till Date</h5>
                    <div class="total-scans-container">
                        <div class="total-scans-box">
                             <strong id="totalScans">0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Pie Chart for OK vs NOT OK -->
            <div class="card card-custom">
                <div class="card-body">
                    <h5>OK vs NOT OK</h5>
                    <div class="chart-container">
                        <div class="pie-chart" id="pieChart"></div>
                        <div class="legend">
                            <div>
                                <span style="color: #28a745;">&#9632;</span> OK: <span id="okCount">0</span>
                                &nbsp;&nbsp;&nbsp;
                                <span style="color: #dc3545;">&#9632;</span> NOT OK: <span id="notOkCount">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Bar Chart for Past 10 Days -->
            <div class="card card-custom" style="grid-column: span 2; height: 300px;"> <!-- Increased height -->
                <div class="card-body">
                    <h5>Past 10 Days Scan Comparison</h5>
                    <div class="chart-container">
                        <div class="bar-chart" id="barChart"></div>
                        <div class="x-axis" id="xAxis"></div>
                        <div class="y-axis" id="yAxis"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOMContentLoaded event listener
        document.addEventListener('DOMContentLoaded', () => {
            fetchReportData();
        });

        // Fetch report data from the backend
        function fetchReportData() {
            window.electron.send('fetch-report-data', { vcode: 'report', id: '', col: '' });
            window.electron.receive('report-data-fetched', (response) => {
                if (response.success) {
                    const reportData = response.report;
                    const totalScanData = reportData.find(item => item.metric === 'Total Scanned Records');
                    const scansPerDay = reportData.filter(item => item.metric === 'Scans Per Day');
                    const okNotOkSummary = reportData.find(item => item.metric === 'OK/Not OK Summary');

                    const filteredData = {
                        total_scans_per_part: totalScanData ? totalScanData.value : 0,
                        scans_per_day: scansPerDay,
                        total_all_ok: okNotOkSummary ? okNotOkSummary.total_ok : 0,
                        total_not_ok: okNotOkSummary ? okNotOkSummary.total_not_ok : 0
                    };
                    console.log('Filtered Data:', filteredData);
                    updateDashboard(filteredData);
                } else {
                    console.error('Error fetching report data:', response.error);
                }
            });
        }

        // Update dashboard with fetched data
        function updateDashboard(data) {
            // Update Total Scans
            document.getElementById('totalScans').innerHTML = `Total: <strong>${data.total_scans_per_part}</strong>`;

            // Update Pie Chart
            const pieChart = document.getElementById('pieChart');
            const total = data.total_all_ok + data.total_not_ok;
            const okPercentage = (data.total_all_ok / total) * 100;
            const notOkPercentage = (data.total_not_ok / total) * 100;
            pieChart.style.background = `conic-gradient(#28a745 0% ${okPercentage}%, #dc3545 ${okPercentage}% 100%)`;
            document.getElementById('okCount').textContent = data.total_all_ok;
            document.getElementById('notOkCount').textContent = data.total_not_ok;

            // Update Bar Chart
            const barChart = document.getElementById('barChart');
            const xAxis = document.getElementById('xAxis');
            const yAxis = document.getElementById('yAxis');
            barChart.innerHTML = '';
            xAxis.innerHTML = '';
            yAxis.innerHTML = '';

            const maxScans = Math.max(...data.scans_per_day.map(dayData => dayData.total_scans));
            const yAxisLabels = Array.from({ length: 5 }, (_, i) => Math.round((maxScans / 4) * i));
            yAxisLabels.reverse().forEach(label => {
                const yLabel = document.createElement('div');
                yLabel.textContent = label;
                yAxis.appendChild(yLabel);
            });

            data.scans_per_day.forEach(dayData => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${(dayData.total_scans / maxScans) * 100}%`;
                const barLabel = document.createElement('div');
                barLabel.classList.add('bar-label');
                barLabel.textContent = dayData.total_scans;
                bar.appendChild(barLabel);
                barChart.appendChild(bar);

                const xLabel = document.createElement('div');
                xLabel.textContent = dayData.date;
                xAxis.appendChild(xLabel);
            });
        }
    </script>
</body>

</html>
